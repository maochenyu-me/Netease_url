name: Build image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build & push (amd64 + arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    name: Smoke test (amd64)
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image for local run
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: netease-url:ci
          platforms: linux/amd64
          cache-from: type=gha

      - name: 镜像里不应包含 cookie
        run: |
          if docker run --rm netease-url:ci test -e /app/cookie.txt; then
            echo "::error::cookie.txt 被打进了镜像，凭证会泄露"
            exit 1
          fi
          echo "OK: 镜像内无 cookie.txt"

      - name: 启动容器
        run: |
          docker run -d --name ci -p 5000:5000 netease-url:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/health > /dev/null 2>&1; then
              echo "health OK after ${i}0s"; break
            fi
            sleep 2
          done

      - name: 校验 /health
        run: |
          curl -fsS http://127.0.0.1:5000/health -o health.json
          cat health.json
          python3 - <<'PY'
          import json
          data = json.load(open('health.json'))
          assert data['data']['service'] == 'running', data
          assert 'cookie_status' in data['data'], data
          print('OK: /health', data['data']['cookie_status'])
          PY

      - name: 校验 /api/info 里列出了 /stream
        run: |
          curl -fsS http://127.0.0.1:5000/api/info -o info.json
          python3 - <<'PY'
          import json
          data = json.load(open('info.json'))
          endpoints = data['data']['endpoints']
          assert '/stream' in endpoints, endpoints
          print('OK: endpoints =', sorted(endpoints))
          PY

      - name: 校验 /stream 路由已注册（缺参数应返回 400 而不是 404）
        run: |
          code=$(curl -s -o stream.json -w '%{http_code}' http://127.0.0.1:5000/stream)
          cat stream.json; echo
          if [ "$code" != "400" ]; then
            echo "::error::/stream 返回 $code，说明路由没注册（期望 400 参数错误）"
            exit 1
          fi
          echo "OK: /stream 路由存在，参数校验生效"

      - name: 校验 /stream 的 HEAD 与非法音质
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -I "http://127.0.0.1:5000/stream?id=287398&level=ultra")
          echo "非法 level → $code"
          [ "$code" = "400" ] || { echo "::error::期望 400，实际 $code"; exit 1; }

      - name: 容器日志
        if: always()
        run: docker logs ci || true

      - name: 清理
        if: always()
        run: docker rm -f ci || true

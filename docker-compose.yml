services:
  netease-url:
    # 用 GitHub Actions 构建好的镜像（amd64 / arm64 都有）
    image: ghcr.io/maochenyu-me/netease-url:latest
    # 想在服务器上自己构建就注释掉上面 image，取消下面两行注释
    # build:
    #   context: .
    container_name: netease-url
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      TZ: Asia/Shanghai
      PORT: 5000
      # cookie 二选一：
      #   a) 环境变量（推荐）：写在同目录 .env 里，改完 restart 即可
      MUSIC_COOKIE: ${MUSIC_COOKIE:-}
      #   b) 挂载文件：把 music_cookie 那行注释掉，取消下面 volumes 注释
    # volumes:
    #   - ./cookie.txt:/app/cookie.txt:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
